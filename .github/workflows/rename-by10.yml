name: Rename by-10 commercial
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload/by10-commercial
      - name: Rename commercial and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv media/my-empire-by10-upload.mp4 media/my-empire-by10.mp4
          git rm .github/workflows/rename-by10.yml
          git commit -m "Rename by-10 commercial to media/my-empire-by10.mp4"
          git push




















