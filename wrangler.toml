name = "meechies-world"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[ai]
binding = "AI"

# Meechie's World's own free sign-in + database (Cloudflare D1) and file storage (Workers KV)
[[d1_databases]]
binding = "DB"
database_name = "meechies-world-db"
database_id = "239edbe9-4ae7-462e-ac4a-ecd2c2342a77"

[[kv_namespaces]]
binding = "MEDIA"
id = "4c6c12f437f74296b33c17b9ad441473"

[vars]
# Google's public sign-in id (the "Continue with Google" button). Not a secret.
GOOGLE_CLIENT_ID = "429216763635-bfgt31qbolbj0ijh5b5ckqcfb63ftt9u.apps.googleusercontent.com"
# Facebook app "Meechie's World" (public id). The App Secret goes in Cloudflare → Settings → Variables and secrets as FACEBOOK_APP_SECRET.
FACEBOOK_APP_ID = "1647476820055585"
